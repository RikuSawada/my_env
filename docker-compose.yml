version: "3.8"

volumes:
  postgres_data:
    driver: local

services:
  db:
    build:
      context: .
      dockerfile: ./infra/postgresql/Dockerfile
    container_name: appdb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
      TZ: "Asia/Tokyo"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "15432:5432"
    volumes:
      - ./infra/postgresql/volumes:/var/lib/postgresql/data
      - ./infra/postgresql/dumpdata:/docker-entrypoint-initdb.d

  backend:
    container_name: appbackend
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
      - "5005:5005"
    dns:
      - 8.8.8.8
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/appdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - db

  frontend:
    container_name: appfrontend
    build:
      context: ./frontend
      dockerfile: ../infra/node/Dockerfile
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/usr/src/app
    tty: true
    depends_on:
      - backend

  nginx:
    container_name: appnginx
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend
